[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switch-sd-setup"
version = "0.1.0"
description = "Windows tool that builds, updates and repairs an Atmosphere + hekate + homebrew SD card for the Nintendo Switch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Omkar-Desai01/switch-sd-setup"
Issues = "https://github.com/Omkar-Desai01/switch-sd-setup/issues"
Changelog = "https://github.com/Omkar-Desai01/switch-sd-setup/blob/main/CHANGELOG.md"
Funding = "https://buymeacoffee.com/ok_27"

[project.scripts]
sdsetup = "sdsetup.cli:main"

[project.gui-scripts]
switch-sd-setup = "sdsetup.gui:main"

[tool.setuptools]
packages = ["sdsetup"]
