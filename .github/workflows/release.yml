name: Release

# Push a tag such as v0.1.0 to build and publish a release.
# Run it by hand (Actions tab > Release > Run workflow) to test the build without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import sdsetup; print(sdsetup.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Install build tools
        run: python -m pip install pyinstaller

      - name: Build (build.py runs the tests first)
        run: python build.py

      - name: Package
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}" } else { "dev" }
          $zip = "SwitchSDSetup-$tag-windows.zip"
          Compress-Archive -Path release/SwitchSDSetup/* -DestinationPath $zip
          $sums = @((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip)
          foreach ($exe in Get-ChildItem release/SwitchSDSetup -Filter *.exe) {
            $sums += (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $exe.Name
          }
          $sums | Out-File SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[" + [regex]::Escape($version) + "\][^\n]*\n(.*?)(?=\n## \[|\n\[[0-9]|\z)"
          $m = [regex]::Match($text, $pattern)
          if (-not $m.Success) { throw "CHANGELOG.md has no entry for $version" }
          $notes = $m.Groups[1].Value.Trim()
          $notes += "`n`n---`n"
          $notes += "**Verify your download:** compare the SHA-256 of the zip with `SHA256SUMS.txt`. "
          $notes += "The zip carries a build-provenance attestation (`gh attestation verify <file> --repo ${{ github.repository }}`).`n`n"
          $notes += "Windows SmartScreen may warn because the executables are not code-signed yet.`n`n"
          $notes += "If this saved you time: https://buymeacoffee.com/ok_27"
          $notes | Out-File release-notes.md -Encoding utf8

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: SwitchSDSetup-*-windows.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            SwitchSDSetup-*-windows.zip
            SHA256SUMS.txt
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}

      - name: Keep the build for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: SwitchSDSetup-dev-build
          path: |
            SwitchSDSetup-*-windows.zip
            SHA256SUMS.txt
